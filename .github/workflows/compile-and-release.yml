name: Compile and Release Translations

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile language files
        run: |
          rm -rf dist
          node scripts/compile-lang-files.js

      - name: Create component archives
        working-directory: dist
        run: |
          for component in */; do
            component="${component%/}"
            zip -r "${component}.zip" "${component}"
          done

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: translation-zips
          path: dist/*.zip
          if-no-files-found: error

      - name: Release ZIP archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Translation build ${{ github.run_number }}
          generate_release_notes: true
          files: dist/*.zip
